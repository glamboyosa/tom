<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - Thomas's Resume</title>
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .nav {
            margin-bottom: 20px;
            display: none;
            /* Hidden by default */
        }

        .nav a {
            color: #333;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid #333;
            border-radius: 4px;
        }

        .nav a:hover {
            background-color: #333;
            color: white;
        }

        #qrcode {
            margin: 20px auto;
            display: flex;
            justify-content: center;
        }

        #qrcode img {
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="nav" id="backNav">
            <a href="index.html">Back to Resume</a>
        </div>
        <h1>Scan to view Thomas's Resume</h1>
        <div id="qrcode"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Check if user came from the main site
            const referrer = document.referrer;
            const backNav = document.getElementById('backNav');

            if (referrer.includes('tom.glamboyosa.xyz')) {
                backNav.style.display = 'block';
            }

            new QRCode(document.getElementById("qrcode"), {
                text: "https://tom.glamboyosa.xyz",
                width: 256,
                height: 256,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        });
    </script>
</body>

</html>
